[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "run_ctrl"
version = "0.1.0"
description = "pnCCD detector run control with MLflow"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "mlflow-skinny>=2.10",
    "fabric>=3.2",
    "requests>=2.31",
    "paramiko>=3.4",
]

[project.scripts]
run_ctrl = "run_ctrl.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
